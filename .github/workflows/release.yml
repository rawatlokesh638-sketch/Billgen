name: BillGen Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master

jobs:
  build:
    name: Build BillGen Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Decode Default Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Decode Custom Release Keystore (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app
            echo "$KEYSTORE_BASE64" | base64 --decode > app/billgen-release.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/app/billgen-release.jks" >> $GITHUB_ENV
          fi

      - name: Create fallback .env file
        run: |
          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare Release Artifact
        run: |
          mkdir -p release
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release/BillGen-release.apk \;
          ls -la release/

      - name: Upload BillGen APK
        uses: actions/upload-artifact@v4
        with:
          name: BillGen-release-apk
          path: release/BillGen-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: BillGen ${{ github.ref_name }}
          files: release/BillGen-release.apk
          generate_release_notes: true
